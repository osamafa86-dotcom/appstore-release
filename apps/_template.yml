# قالب تطبيقٍ جديد — انسخه إلى apps/<اسم-قصير>.yml (حروف صغيرة وأرقام وشرطات)
name: "اسم التطبيق"
bundle_id: com.example.app
bundle_name: Example App               # اسم المعرّف في بوابة المطوّرين
sku: example-app-ios
team_id: Y4R9ZHWK9Y
version: "1.0.0"

source:
  repo: owner/repo
  ref: main
  private: false                       # true يتطلّب السرّ SOURCE_REPO_TOKEN (قراءة المستودع)
  workdir: ios                         # مجلد المشروع داخل المستودع

build:
  python: ""                           # مثل "3.12" إن احتاج التحضير Python
  pip: []
  brew: []                             # مثل [xcodegen] أو [cocoapods]
  cache: {}                            # {path: ..., key: ...}
  prepare: |                           # أوامر قبل الأرشفة (توليد المشروع، pod install، flutter build ios --no-codesign…)
    true
  test: ""                             # أمر اختبار اختياري؛ فشله يوقف الرفع
  project: App.xcodeproj               # أو App.xcworkspace
  scheme: App
  signing: automatic                   # automatic: Xcode يدير الملفات بمفتاح ASC؛ manual: يتطلّب profile وضبط المشروع
  profile: ""                          # اسم ملف provisioning مع manual
  extensions: []                       # [{bundle_suffix: widget, name: ..., profile: ...}]

store:
  metadata: ios/store/metadata         # بنية fastlane deliver: <locale>/name.txt …
  screenshots: ios/store/screenshots   # <locale>/*.png بمقاسات آبل
  names: ["اسم المتجر"]
  primary_category: UTILITIES
  secondary_category: ""
  price: free
  exclude_territories: []
  third_party_content: false
  automatic_release: true

# ── اختياري: Google Play (فروع play-*) — احذف القسم إن لم يكن للتطبيق نسخة Android ──
android:
  package: com.example.app
  workdir: android                     # مجلد مشروع Gradle داخل المستودع
  java: "21"
  gradle: ""                           # فارغ = ./gradlew من المشروع؛ أو نسخة مثل "8.14.3"
  python: ""
  prepare: ""                          # أوامر قبل البناء (flutter build appbundle يحتاج task مختلفًا…)
  test: ""
  task: ":app:bundleRelease"
  aab: app/build/outputs/bundle/release/*.aab
  version_code_base: 1000              # versionCode = هذا + رقم تشغيل سير play
  key_alias: upload
  env:                                 # أسماء متغيّرات البيئة التي يقرؤها build.gradle(.kts)
    version_code: APP_VERSION_CODE     # versionCode = System.getenv("APP_VERSION_CODE")
    keystore: APP_KEYSTORE             # مسار ملف المفتاح
    password: APP_KEYSTORE_PASSWORD    # كلمة سرّه (وكلمة المفتاح نفسها)
    alias: APP_KEY_ALIAS               # اختياري
  metadata: android/store/metadata/android   # بنية fastlane supply: <lang>/title.txt، short_description.txt،
                                             # full_description.txt، changelogs/default.txt، images/…
  contact: {website: "", email: "", phone: ""}   # بيانات التواصل العامة (play-details)
