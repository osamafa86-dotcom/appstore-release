# المكتبة المرئية — تطبيق رفع المراسلين على Android، في مستودع post-history (apps/android)
# نسخة iOS في apps/posthistory.yml. هنا Google Play وحده (فروع play-*).
name: "المكتبة المرئية"
version: "0.1.0"

source:
  repo: osamafa86-dotcom/post-history
  ref: main
  private: false

android:
  package: net.palpost.library
  workdir: apps/android
  java: "21"
  gradle: ""                       # gradlew المشروع (Gradle 8.14.3، بصمته مثبّتة)
  python: ""
  # عنوان /v1 لخادم التجربة: البناء النهائي يرفض غير https. يُملأ حين يُحدَّد نطاق التجربة.
  prepare: |
    TRIAL_API_BASE_URL=""
    if [ -n "$TRIAL_API_BASE_URL" ]; then echo "apiBaseUrl=$TRIAL_API_BASE_URL" >> gradle.properties; fi
  test: "./gradlew --no-daemon :core:test"
  task: ":app:bundleRelease"
  aab: app/build/outputs/bundle/release/*.aab
  version_code_base: 1000
  key_alias: upload
  env:
    version_code: APP_VERSION_CODE
    keystore: APP_KEYSTORE
    password: APP_KEYSTORE_PASSWORD
    alias: APP_KEY_ALIAS
  metadata: apps/android/store/metadata/android
  contact: {website: "", email: "", phone: ""}
