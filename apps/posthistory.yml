# PostHistory — تطبيق المراسلين (SwiftUI، XcodeGen) في مستودع post-history
name: "مكتبة بوست"                    # اسم السجلّ في App Store Connect
bundle_id: net.palpost.posthistory
bundle_name: PostHistory
sku: posthistory-ios
team_id: Y4R9ZHWK9Y                    # يؤكده المالك (post-history#159)
version: "0.1.0"

source:
  repo: osamafa86-dotcom/post-history
  ref: main
  private: false
  workdir: apps/ios

build:
  python: ""
  pip: []
  brew: [xcodegen]
  cache: {}
  # عنوان /v1 لخادم التجربة يُكتب في API.local.xcconfig (غير ملتزَم به في post-history) قبل توليد المشروع.
  # فارغًا يبقى عنوان العقد المثالي ولا يتصل البناء بأي خادم: يُملأ حين يحدد المالك نطاق التجربة.
  prepare: |
    TRIAL_API_BASE_URL=""
    if [ -n "$TRIAL_API_BASE_URL" ]; then
      printf 'PH_API_BASE_URL = %s\n' "$(printf '%s' "$TRIAL_API_BASE_URL" | sed 's#//#/$()/#')" > App/Config/API.local.xcconfig
    fi
    xcodegen generate
  test: cd Packages/PostHistoryKit && swift test 2>&1 | tail -40
  project: PostHistory.xcodeproj
  scheme: PostHistory
  signing: manual                      # شهادة التوزيع في الأسرار؛ الآلي بلغ حدّ الشهادات (2026-10-27). الإعداد في apps/ios/project.yml
  profile: PostHistory AppStore CI
  extensions: []

store:
  metadata: apps/ios/store/metadata
  screenshots: apps/ios/store/screenshots
  names: ["مكتبة بوست"]   # اسم السجلّ الذي أنشأه المالك في App Store Connect (2026-10-27)
  primary_category: NEWS
  secondary_category: ""
  price: free
  exclude_territories: []
  third_party_content: false
  automatic_release: false
